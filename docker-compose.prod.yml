version: '3.8'

# Production Compose File - Pulls pre-built multi-arch images from GHCR
# Usage: docker compose -f docker-compose.prod.yml up -d

services:
  postgres:
    image: postgres:14-alpine
    container_name: bukshort_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-bukshort}
    expose:
      - 5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-bukshort}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: ghcr.io/${GHCR_OWNER:-bukharney}/bukshort-backend:latest
    container_name: bukshort_backend
    restart: unless-stopped
    environment:
      DB_URL: "host=postgres user=${POSTGRES_USER:-postgres} password=${POSTGRES_PASSWORD:-postgres} dbname=${POSTGRES_DB:-bukshort} port=5432 sslmode=disable"
      PORT: ${BACKEND_PORT:-8080}
    expose:
      - 8080
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app_net

  frontend:
    image: ghcr.io/${GHCR_OWNER:-bukharney}/bukshort-frontend:latest
    container_name: bukshort_frontend
    restart: unless-stopped
    environment:
      PORT: ${FRONTEND_PORT:-3000}
      HOST: "0.0.0.0"
      API_URL: ${API_URL:-http://backend:8080}
    depends_on:
      - backend
    networks:
      - app_net

volumes:
  postgres_data:


networks:
  app_net:
    driver: bridge
